<!DOCTYPE html>
<html>
<head>
<title>Temperature Converter</title>

<style>

body{
    background:#111827;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:400px;
    background:#1F2937;
    padding:40px;
    border-radius:20px;
    text-align:center;
}

h1{
    color:#10B981;
}

input{
    width:90%;
    padding:14px;
    margin:20px 0;
    border:none;
    border-radius:10px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#10B981;
    color:white;
    cursor:pointer;
}

.result{
    margin-top:20px;
    color:#FBBF24;
    font-size:22px;
}

</style>

</head>

<body>

<div class="card">

<h1>Temperature Converter</h1>

<form method="POST">

<input type="number" step="any" name="celsius" placeholder="Enter Celsius" required>

<br>

<button type="submit">Convert</button>

</form>

<div class="result">
{{ result }}
</div>

<br>

<a href="{{ url_for('home') }}">
<button>Home</button>
</a>

</div>

</body>
</html>
